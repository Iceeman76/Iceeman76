<svg xmlns="http://www.w3.org/2000/svg" width="400" height="112" viewBox="0 0 400 112">
  <title>Json</title>
  <desc>A navigable JSON tree with JSONPath-like queries, builders and field extraction.</desc>
  <style>
    .card { fill: #ffffff; stroke: #d1d9e0; }
    .name { fill: #0969da; }
    .description { fill: #454f59; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #3d444d; }
      .name { fill: #58a6ff; }
      .description { fill: #b1bac4; }
    }
  </style>
  <rect class="card" x=".5" y=".5" width="399" height="111" rx="8"/>
  <text class="name" x="16" y="26" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600">Json</text>
  <text class="description" font-family="Segoe UI, sans-serif" font-size="14">
    <tspan x="16" y="48">A navigable JSON tree with JSONPath-like</tspan>
    <tspan x="16" y="65">queries, builders and field extraction.</tspan>
  </text>
  <defs><clipPath id="artwork"><rect x="300" y="15" width="84" height="42" rx="5"/></clipPath></defs>
  <image x="300" y="15" width="84" height="42" clip-path="url(#artwork)" href="data:image/jpeg;base64,"/>
</svg>
