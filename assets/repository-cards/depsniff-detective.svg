<svg xmlns="http://www.w3.org/2000/svg" width="416" height="112" viewBox="0 0 416 112">
  <title>DepSniff</title>
  <desc>A .NET command-line tool for finding redundant or unused NuGet packages and project references, using Roslyn and MSBuild.</desc>
  <style>
    .card { fill: #ffffff; stroke: #d1d9e0; }
    .name { fill: #0969da; }
    .description { fill: #454f59; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #3d444d; }
      .name { fill: #58a6ff; }
      .description { fill: #b1bac4; }
    }
  </style>
  <rect class="card" x="6.5" y=".5" width="409" height="111" rx="8"/>
  <text class="name" x="22" y="26" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600">DepSniff</text>
  <text class="description" font-family="Segoe UI, sans-serif" font-size="14">
    <tspan x="22" y="48">A .NET CLI for finding redundant or unused</tspan>
    <tspan x="22" y="65">NuGet packages and project references.</tspan>
    <tspan x="22" y="82">Uses Roslyn and MSBuild.</tspan>
  </text>
  <defs><clipPath id="artwork"><rect x="316" y="15" width="84" height="42" rx="5"/></clipPath></defs>
  <image x="316" y="15" width="84" height="42" clip-path="url(#artwork)" href="data:image/jpeg;base64,"/>
</svg>
