<svg xmlns="http://www.w3.org/2000/svg" width="416" height="124" viewBox="0 0 416 124">
  <title>Sudoku</title>
  <desc>A high-performance Sudoku solver combining logical deduction, backtracking and parallel batch solving.</desc>
  <style>
    .card { fill: #ffffff; stroke: #d1d9e0; }
    .name { fill: #0969da; }
    .description { fill: #454f59; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #3d444d; }
      .name { fill: #58a6ff; }
      .description { fill: #b1bac4; }
    }
  </style>
  <rect class="card" x="0.5" y=".5" width="409" height="111" rx="8"/>
  <text class="name" x="16" y="26" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600">Sudoku</text>
  <text class="description" font-family="Segoe UI, sans-serif" font-size="14">
    <tspan x="16" y="48">A high-performance Sudoku solver combining</tspan>
    <tspan x="16" y="65">logical deduction, backtracking and parallel</tspan>
    <tspan x="16" y="82">batch solving.</tspan>
  </text>
  <defs><clipPath id="artwork"><rect x="310" y="15" width="84" height="42" rx="5"/></clipPath></defs>
  <image x="310" y="15" width="84" height="42" clip-path="url(#artwork)" href="data:image/jpeg;base64,"/>
</svg>
